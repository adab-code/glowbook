name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch instead of queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, format, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # `npm ci` runs `postinstall`, which is `prisma generate`. That needs the
      # schema only, so no database is required for any step below.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # `src/lib/db.ts` throws at import time when DATABASE_URL is missing, and
      # Next evaluates the route modules while collecting page data, so the
      # build needs the variable to be present. These placeholders are never
      # dialled: nothing connects to a database during the build.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_placeholder?schema=public
          AUTH_SECRET: ci-placeholder-secret-not-used-at-build
          AUTH_TRUST_HOST: "true"
